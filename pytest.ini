[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unitaria: funciones puras, sin base de datos ni HTTP
    regla_critica: reglas de negocio críticas contra los servicios
    conflicto: no doble reserva (secuencial, concurrente, cruce reserva/bloqueo)
    validacion: validaciones de datos de entrada del usuario
    aceptacion: criterios AC-xx contra la API
    ac(id): criterio de aceptación que cubre la prueba, p. ej. ac("AC-05")
