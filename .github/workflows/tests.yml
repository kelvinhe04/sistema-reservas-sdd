name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: clave-de-prueba
      TZ: America/Panama
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Hasta que exista requirements.txt (T-01)
            pip install pytest httpx tzdata
          fi

      - name: Ejecutar pruebas
        run: pytest -v

      - name: Pruebas obligatorias de no doble reserva
        run: pytest -v -m conflicto
